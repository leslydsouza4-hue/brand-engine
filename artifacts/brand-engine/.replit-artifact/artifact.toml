kind = "web"
previewPath = "/"
title = "Brand Engine"
version = "1.0.0"
id = "artifacts/brand-engine"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24830

[services.development]
run = "pnpm --filter @workspace/brand-engine run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/brand-engine", "run", "build" ]
publicDir = "artifacts/brand-engine/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24830"
BASE_PATH = "/"
